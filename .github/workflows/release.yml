# Release: on every "vX.Y.Z" tag GitHub builds OBSYard on Windows (injected scripts, OBS plugin
# included through build.rs, NSIS installer) and publishes the installer in a Release for that tag.
#
#   1. set the version to X.Y.Z in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json
#   2. git commit, git tag vX.Y.Z, git push --follow-tags
#
# It can also be started by hand (Actions → Release → Run workflow): it builds and keeps the
# installer among the run's artifacts, without publishing a Release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $pkg -or $tag -ne $cargo) {
            Write-Error "Tag $tag does not match the versions: tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # the app and the OBS plugin (built by build.rs into src-tauri/target/obs-plugin)
          workspaces: src-tauri -> target

      - name: Dependencies
        run: npm ci

      - name: Build and Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OBSYard ${{ github.ref_name }}
          releaseBody: |
            Windows installer (NSIS). Includes the OBS plugin: after installing, Control room → OBS plugin → Install the plugin, then restart OBS.
          releaseDraft: true
          prerelease: false

      - name: Build (by hand)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - name: Installer as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: OBSYard-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
