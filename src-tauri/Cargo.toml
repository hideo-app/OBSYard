[package]
name = "obsyard"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "obsyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros"] }
futures-util = "0.3"
url = "2"
# uscite verso il plugin OBS: memoria condivisa (layout in ../shm-proto)
obsyard-shm = { path = "../shm-proto" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
# stessa versione di wry: buffer condivisi WebView2 verso la finestra studio
webview2-com = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
