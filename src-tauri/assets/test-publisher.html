<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>OBSYard – finto StreamYard (test)</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #1b1d24; color: #eee; display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
  .tile { width: 480px; }
  .tile video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .name { padding: 4px 0; }
</style>
</head>
<body>
<script>
// Simula due ospiti: ogni "ospite" è una coppia di RTCPeerConnection in loopback.
// La PC ricevente è creata dalla pagina, quindi l'hook di OBSYard ne vede le tracce come "remote".
const guests = [["Mario Rossi", "#e4572e"], ["Giulia Bianchi", "#17bebb"], ["Luca Ferri", "#7a5cfa"]];

function source(name, color, freq) {
  const c = Object.assign(document.createElement("canvas"), { width: 1280, height: 720 });
  const g = c.getContext("2d");
  let f = 0;
  (function draw() {
    f++;
    g.fillStyle = color; g.fillRect(0, 0, 1280, 720);
    g.fillStyle = "#fff"; g.font = "bold 90px system-ui"; g.fillText(name, 60, 200);
    g.font = "60px monospace"; g.fillText("frame " + f, 60, 330);
    g.fillText(new Date().toISOString().slice(11, 23), 60, 420);
    g.fillRect((f * 12) % 1280, 560, 80, 80);
    requestAnimationFrame(draw);
  })();
  const stream = c.captureStream(30);
  const ac = new AudioContext();
  const osc = ac.createOscillator(); osc.frequency.value = freq;
  const gain = ac.createGain(); gain.gain.value = 0.05;
  const dst = ac.createMediaStreamDestination();
  osc.connect(gain).connect(dst); osc.start();
  stream.addTrack(dst.stream.getAudioTracks()[0]);
  return stream;
}

// Protocollo StreamYard simulato: i messaggi passano da un WebSocket "eco" del server locale,
// così lo script dello studio li riceve come messaggi in arrivo (streamUpdated, clientUpdated, offer).
const echo = new WebSocket(`ws://${location.host}/test/echo`);
const echoOpen = new Promise((r) => (echo.onopen = r));
const sy = async (command, body) => {
  await echoOpen;
  echo.send(JSON.stringify({ message: { command, body }, type: "message" }));
  await new Promise((r) => setTimeout(r, 50)); // il messaggio torna indietro prima di proseguire
};
window.sy = sy; // per i test: es. sy("streamUpdated", {...privacy: "moderators"})

async function guest(name, color, freq, kind = "webcam") {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `<video autoplay muted playsinline></video><div class="name">${name}</div>`;
  document.body.appendChild(tile);
  const src = source(name, color, freq);
  const a = new RTCPeerConnection(), b = new RTCPeerConnection();
  a.onicecandidate = e => e.candidate && b.addIceCandidate(e.candidate);
  b.onicecandidate = e => e.candidate && a.addIceCandidate(e.candidate);
  b.ontrack = e => { tile.querySelector("video").srcObject = e.streams[0]; };
  src.getTracks().forEach(t => a.addTrack(t, src));
  (window.senders ??= {})[name] = a; // per i test: spegnere la "camera" di un ospite
  await a.setLocalDescription(await a.createOffer());
  // come StreamYard: nome del client, stato dello stream e offerta col suo streamId
  const streamId = "s-" + name.replace(/\W/g, ""), clientId = "c-" + name.split(" ")[0];
  await sy("clientUpdated", { clientId, displayName: name.split(" (")[0] });
  await sy("streamUpdated", { streamId, clientId, kind, privacy: "public", hasVideo: true });
  await sy("offer", { connectionId: "conn-" + streamId, streamId, jsep: { type: "offer", sdp: a.localDescription.sdp } });
  await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(await b.createAnswer());
  await a.setRemoteDescription(b.localDescription);
}

guests.forEach(([n, c], i) => guest(n, c, 330 + i * 110));
// un ospite che condivide lo schermo (stesso client di Giulia): va assegnato a mano
guest("Giulia Bianchi (schermo)", "#3a3f4b", 550, "screen");

// Finti pulsanti layout come quelli di StreamYard (aria-pressed), per provare "Ospiti a piena risoluzione".
// ?layout=0 li toglie per provare il caso "layout non trovato".
if (new URLSearchParams(location.search).get("layout") !== "0") {
  const bar = document.createElement("div");
  bar.className = "layouts";
  bar.style.cssText = "width:100%;display:flex;gap:6px";
  for (const [label, pressed] of [["Layout sottile.", true], ["Layout di gruppo.", false], ["OBSYard", false]]) {
    const b = Object.assign(document.createElement("button"), { textContent: label });
    b.setAttribute("aria-label", label);
    b.setAttribute("aria-pressed", String(pressed));
    b.onclick = () => bar.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (label === "OBSYard") {
      // come in StreamYard: i layout personalizzati stanno in un blocco annidato a parte
      let box = b;
      for (let i = 0; i < 4; i++) { const d = document.createElement("div"); d.appendChild(box); box = d; }
      bar.appendChild(box);
    } else bar.appendChild(b);
  }
  document.body.prepend(bar);
}
</script>
</body>
</html>
